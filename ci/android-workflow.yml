name: Native Android
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Test, lint, and build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon engineTest testDebugUnitTest lintDebug assembleDebug assembleRelease bundleRelease
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-android-build-and-reports
          path: |
            build/outputs/apk/
            build/outputs/bundle/
            build/reports/
            build/native-previews/
